name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: uv sync --frozen --python 3.12
      - name: Python lint and types
        run: |
          uv run --frozen ruff check .
          uv run --frozen mypy
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b
          npm test -- --run
          npm run build
      - name: Install browser
        run: uv run --frozen playwright install --with-deps chromium
      - name: Python tests
        run: uv run --frozen pytest
      - name: Browser integration tests
        env:
          MDT_BROWSER_TESTS: '1'
        run: uv run --frozen pytest tests/test_browser.py -q
      - name: Compile infrastructure
        shell: pwsh
        run: |
          $inputFile = (Resolve-Path 'infra/main.bicep').Path
          $outputFile = Join-Path $env:RUNNER_TEMP 'mdt-infra.json'
          az bicep build --file $inputFile --outfile $outputFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('scripts/deploy.ps1', 'scripts/verify-azure.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Build production container
        run: docker build --tag mdt-observatory:ci .
      - name: Test deployment polling bounds
        shell: pwsh
        run: ./infra/tests/script-loops.ps1
      - name: Test CLI preflight arguments
        shell: pwsh
        run: ./infra/tests/cli-preflight.ps1
      - name: Test exclusive-writer release safety
        shell: pwsh
        run: ./infra/tests/release-safety.ps1
      - name: Test private Blob infrastructure guards
        shell: pwsh
        run: ./infra/tests/private-storage.ps1
      - name: Test migration and deployment flow
        shell: pwsh
        run: ./infra/tests/deployment-flow.ps1
