[project]
name = "mdt-observatory"
version = "0.1.0"
description = "Synthetic agentic multidisciplinary meeting demonstrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "openai>=1.75,<3",
  "azure-identity>=1.21,<2",
  "azure-storage-blob>=12.25,<13",
  "azure-monitor-opentelemetry>=1.6,<2",
  "opentelemetry-instrumentation-fastapi>=0.52b0,<1",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "playwright>=1.51,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mdt"]
mypy_path = "src"

[tool.coverage.run]
source = ["mdt"]
